<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DrawWithLivv | My Links</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background: linear-gradient(135deg, #eef5e8, #f8f4e9);
            color: #30452f;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .decor {
            font-size: 28px;
            letter-spacing: 8px;
            margin-bottom: 15px;
        }

        .profile {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            margin: 0 auto 18px;

            background: #dce8d2;
            border: 4px solid #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 42px;

            box-shadow: 0 5px 18px rgba(48, 69, 47, 0.12);
        }

        h1 {
            margin: 0;
            font-size: 32px;
            color: #30452f;
        }

        .tagline {
            margin: 10px 0 28px;
            font-size: 16px;
            color: #61735c;
            line-height: 1.5;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link {
            display: block;
            width: 100%;

            padding: 16px 20px;

            background: rgba(255, 255, 255, 0.88);
            color: #30452f;

            text-decoration: none;
            font-size: 17px;
            font-weight: bold;

            border: 2px solid #d4dfcc;
            border-radius: 14px;

            box-shadow: 0 4px 12px rgba(48, 69, 47, 0.08);

            transition: all 0.2s ease;
        }

        .link:hover {
            transform: translateY(-3px);
            background: #ffffff;
            border-color: #9caf91;
            box-shadow: 0 7px 18px rgba(48, 69, 47, 0.14);
        }

        .main-link {
            background: #dce8d2;
            border-color: #b8caaa;
            font-size: 18px;
        }

        .main-link:hover {
            background: #d3e1c8;
        }

        .discord {
            background: #e6eee0;
        }

        .email {
            background: #f4efe1;
            border-color: #e4d9bd;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #7b8976;
        }

        .footer span {
            display: block;
            margin-top: 8px;
        }

        @media (max-width: 500px) {
            body {
                padding: 25px 14px;
            }

            h1 {
                font-size: 28px;
            }

            .link {
                padding: 15px 18px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="decor">🍃 🍂 🌿 🍂 🍃</div>

        <div class="profile">
            🎨
        </div>

        <h1>🌿 DrawWithLivv 🌿</h1>

        <p class="tagline">
            Creating colourful stories, one brushstroke at a time. 🎨
        </p>

        <div class="links">

            <a
                class="link main-link"
                href="https://drawwithlivv-ux.github.io/DrawWithLiv/"
            >
                🧸 Visit My Website
            </a>

            <a
                class="link"
                href="https://www.instagram.com/drawwithlivv/"
                target="_blank"
                rel="noopener noreferrer"
            >
                📸 Instagram
            </a>

            <a
                class="link"
                href="https://www.tiktok.com/@draw_with_livv"
                target="_blank"
                rel="noopener noreferrer"
            >
                🎵 TikTok
            </a>

            <a
                class="link discord"
                href="https://discord.gg/7ZRejAv7at"
                target="_blank"
                rel="noopener noreferrer"
            >
                💬 Join the DrawWithLivv Discord
            </a>

            <a
                class="link email"
                href="mailto:drawwithlivv@gmail.com"
            >
                💌 Email DrawWithLivv
            </a>

        </div>

        <div class="footer">
            🍃 Thank you for supporting my art! 🍃
            <span>© DrawWithLivv</span>
        </div>

    </main>

</body>
</html>
